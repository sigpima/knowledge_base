# Bộ câu hỏi đánh giá truy xuất cho `search_policies` (đọc bởi `python -m scripts.eval_retrieval`).
#
# Mỗi phần tử là một mapping có đúng hai khoá:
#   question: câu hỏi bằng tiếng Việt tự nhiên, như khách hàng, chỉ huy trưởng hoặc nhân viên kinh doanh hay hỏi.
#             Cố ý KHÔNG chép nguyên tiêu đề mục để phép đo phản ánh khả năng khớp ngữ nghĩa chứ không phải khớp chữ.
#   expect:   câu trả lời nằm ở đâu trong data/policies/, một trong ba dạng:
#     {slug: <slug>, section: <tiêu đề ## chính xác>}      câu một nguồn
#     [ {slug, section}, {slug, section} ]                 câu cần hai tài liệu khác nhau (đủ cả hai mới tính là trúng)
#     null                                                 câu NGOÀI phạm vi: kho không có câu trả lời, truy xuất lý ra
#                                                          phải cho điểm thấp (dùng để chọn POLICY_MIN_SCORE)
#
# Cơ cấu: 20 câu một nguồn (mỗi tài liệu trong 12 tài liệu ít nhất một câu), 4 câu hai nguồn, 4 câu ngoài phạm vi.
# `section` phải trùng khít một tiêu đề `##` của tài liệu đó; tests/test_policy_eval_set.py kiểm tra điều này.
# Câu nào có đáp án đáng bàn (hai tài liệu cùng nhắc tới) đều có chú thích `# Đáng bàn:` ngay trên câu đó.
#
# Dữ liệu giả lập, không chứa quy định hay thương hiệu thật.

# ---------------------------------------------------------------- câu một nguồn

# chinh-sach-bao-hanh (3)
- question: "Bảo hành chống thấm hệ cao cấp được bao lâu?"
  expect: {slug: chinh-sach-bao-hanh, section: "Thời hạn tiêu chuẩn theo nhóm hạng mục"}

- question: "Khách mua thêm 6 tháng gia hạn thì khoản tiền công ty giữ lại có phải chờ thêm 6 tháng mới được trả không?"
  expect: {slug: chinh-sach-bao-hanh, section: "Giữ lại bảo hành"}

# Đáng bàn: tài liệu quy-trinh-nghiem-thu (mục "Nghiệm thu bàn giao hoàn công") cũng nói ngày ký biên bản là ngày bảo hành
# bắt đầu; mục được chọn là nơi giải thích đầy đủ và loại trừ mốc ký hợp đồng và mốc nghiệm thu giai đoạn.
- question: "Thời hạn bảo hành được tính từ ngày ký hợp đồng hay từ ngày nào?"
  expect: {slug: chinh-sach-bao-hanh, section: "Bảo hành bắt đầu từ khi nào"}

