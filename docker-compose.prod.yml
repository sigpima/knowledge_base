# Override cho máy chủ thật, ghép với docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# hoặc đặt trong .env trên server (khi đó chỉ cần `docker compose up -d`):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#   COMPOSE_PROFILES=chat
#   IMAGE_TAG=latest   # có thể bỏ (mặc định latest); ghim/rollback theo commit: IMAGE_TAG=sha-abc1234
# Cập nhật: `docker compose pull && docker compose up -d`.
#
# Khác với bản demo:
#   - dùng image dựng sẵn từ ghcr (workflow .github/workflows/image.yml), không build trên server (cần Docker Compose >= 2.24 cho `!reset`);
#   - db và mcp có restart (server khởi động lại thì tự lên), Postgres có volume;
#   - `api` (ingest, có quyền ghi) nằm sau profile `ingest`, không chạy mặc định;
#   - mạng có tên cố định `kb-net` để backend khác trên cùng máy nối vào (http://chat:8003, http://mcp:8002/mcp) mà không cần mở cổng host.
# Cổng host vẫn chỉ bind 127.0.0.1 (khai báo ở docker-compose.yml); đừng phơi 8002 (MCP không xác thực) ra internet.
# Lưu ý: `seed` xoá và nạp lại dữ liệu mẫu mỗi lần `up`, nên mỗi lần triển khai có vài giây dữ liệu trống.
# Lưu ý: `chat` giữ một phiên MCP; nếu `mcp` tự crash rồi được Docker bật lại thì chạy `docker compose restart mcp chat`.

x-image: &image ghcr.io/sigpima/knowledge_base:${IMAGE_TAG:-latest}

services:
  db:
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data  # POSTGRES_PASSWORD chỉ có tác dụng lần khởi tạo đầu; đổi sau này phải `down -v`
  seed:
    image: *image
    build: !reset null
  api:
    image: *image
    build: !reset null
    profiles: ["ingest"]
  mcp:
    image: *image
    build: !reset null
    restart: unless-stopped
  chat:
    image: *image
    build: !reset null
  policy-seed:
    image: *image
    build: !reset null

volumes:
  pgdata:

networks:
  default:
    name: kb-net
