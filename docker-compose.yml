# Demo một lệnh: `docker compose up` dựng Postgres, nạp dữ liệu mẫu rồi bật API ingest + MCP server.
# API chat cho web (service `chat`) cần khoá Gemini nên chỉ bật khi chọn profile: `docker compose --profile chat up`.
# Mật khẩu dưới đây chỉ dành cho demo trên máy cá nhân; đổi bằng biến môi trường hoặc file .env.

x-app: &app
  image: knowledge-base:demo
  build: .

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-password}
      POSTGRES_DB: knowledge_base
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 2s
      timeout: 3s
      retries: 30

  seed:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-demo-password}@db:5432/knowledge_base
      RO_PASSWORD: ${RO_PASSWORD:-demo-readonly}
    command: sh -c "python -m scripts.init_db && python -m scripts.seed data/sample"
    restart: "no"

  api:
    <<: *app
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-demo-password}@db:5432/knowledge_base
      API_HOST: 0.0.0.0  # trong container; cổng host vẫn chỉ mở trên 127.0.0.1 (xem ports)
    command: python main.py
    ports:
      - "127.0.0.1:8000:8000"

  mcp:
    <<: *app
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_READONLY: postgresql+psycopg2://knowledge_base_ro:${RO_PASSWORD:-demo-readonly}@db:5432/knowledge_base
      MCP_SERVER_HOST: 0.0.0.0
    command: python main_mcp.py
    ports:
      - "127.0.0.1:8002:8002"

  chat:
    <<: *app
    profiles: ["chat"]  # không chạy với `docker compose up` thường; bật bằng `--profile chat` hoặc COMPOSE_PROFILES=chat
    depends_on:
      mcp:
        condition: service_started
        restart: true  # phiên MCP của chat là có trạng thái: mcp khởi động lại (qua compose) thì chat khởi động lại theo
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}  # khoá Gemini lấy từ môi trường máy chủ/.env, không có giá trị mặc định
      MCP_SERVER_URL: http://mcp:8002/mcp
      CHAT_API_HOST: 0.0.0.0  # trong container; cổng host vẫn chỉ mở trên 127.0.0.1 (xem ports)
    command: python main_chat.py
    ports:
      - "127.0.0.1:8003:8003"
    restart: unless-stopped
