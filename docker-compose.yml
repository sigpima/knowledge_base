# Demo một lệnh: `docker compose up` dựng Postgres, nạp dữ liệu mẫu rồi bật API ingest + MCP server.
# API chat cho web (service `chat`) cần khoá Gemini nên chỉ bật khi chọn profile: `docker compose --profile chat up`.
# Hỏi đáp chính sách (RAG, xem docs/rag.md) cũng tuỳ chọn: `GEMINI_API_KEY=... docker compose --profile rag up` thêm Milvus
# (`milvus`) và bước nạp tài liệu chính sách (`policy-seed`, cần khoá Gemini để tạo embedding); ghép được với `--profile chat`.
# `mcp` khởi động độc lập với `policy-seed`: nạp lỗi thì chỉ `search_policies` báo lỗi (xem `docker compose --profile rag logs policy-seed`).
# Mật khẩu dưới đây chỉ dành cho demo trên máy cá nhân; đổi bằng biến môi trường hoặc file .env.

x-app: &app
  image: knowledge-base:demo
  build: .

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-password}
      POSTGRES_DB: knowledge_base
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 2s
      timeout: 3s
      retries: 30

  seed:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-demo-password}@db:5432/knowledge_base
      RO_PASSWORD: ${RO_PASSWORD:-demo-readonly}
    command: sh -c "python -m scripts.init_db && python -m scripts.seed data/sample"
    restart: "no"

  api:
    <<: *app
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:-demo-password}@db:5432/knowledge_base
      API_HOST: 0.0.0.0  # trong container; cổng host vẫn chỉ mở trên 127.0.0.1 (xem ports)
    command: python main.py
    ports:
      - "127.0.0.1:8000:8000"

  mcp:
    <<: *app
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL_READONLY: postgresql+psycopg2://knowledge_base_ro:${RO_PASSWORD:-demo-readonly}@db:5432/knowledge_base
      MCP_SERVER_HOST: 0.0.0.0
      # Tool search_policies (tuỳ chọn): cần Milvus (profile `rag`) và khoá Gemini để nhúng câu hỏi. `mcp` cố ý KHÔNG chờ `policy-seed`:
      # khởi động độc lập; khi chưa nạp xong, hoặc `policy-seed` lỗi (thiếu khoá, Milvus chết, tài liệu sai), `search_policies` trả lỗi tiếng Việt rõ ràng và mọi tool khác vẫn chạy.
      MILVUS_URI: http://milvus:19530  # cố định (như policy-seed): MILVUS_URI hướng host trong .env không được lọt vào container
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-policy_chunks}  # phải trùng với collection lúc nạp (policy-seed)
      POLICY_MIN_SCORE: ${POLICY_MIN_SCORE:-0.0}  # chỉ dùng lúc truy vấn
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}  # phải trùng với model lúc nạp (policy-seed)
    command: python main_mcp.py
    ports:
      - "127.0.0.1:8002:8002"

  # Milvus standalone một container: etcd nhúng + lưu trữ cục bộ trong volume `milvus_data` (cấu hình theo standalone_embed.sh của Milvus).
  # Demo không bật xác thực; cổng gRPC chỉ mở trên 127.0.0.1 (cổng 9091 chỉ dùng nội bộ cho healthcheck).
  milvus:
    image: milvusdb/milvus:v3.0.5
    profiles: ["rag"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 90s
    ports:
      - "127.0.0.1:19530:19530"

  # Nạp tài liệu chính sách vào Milvus: nhúng bằng Gemini nên cần GEMINI_API_KEY; chạy lại an toàn (tài liệu không đổi thì bỏ qua).
  policy-seed:
    <<: *app
    profiles: ["rag"]
    depends_on:
      milvus:
        condition: service_healthy
    environment:
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-policy_chunks}  # phải trùng với collection mà mcp truy vấn
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}  # đổi model thì phải nạp lại (vector gắn với model)
    command: python -m app.cli ingest-policies data/policies --prune
    restart: "no"

  chat:
    <<: *app
    profiles: ["chat"]  # không chạy với `docker compose up` thường; bật bằng `--profile chat` hoặc COMPOSE_PROFILES=chat
    depends_on:
      mcp:
        condition: service_started
        restart: true  # phiên MCP của chat là có trạng thái: mcp khởi động lại (qua compose) thì chat khởi động lại theo
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}  # khoá Gemini lấy từ môi trường máy chủ/.env, không có giá trị mặc định
      MCP_SERVER_URL: http://mcp:8002/mcp
      CHAT_API_HOST: 0.0.0.0  # trong container; cổng host vẫn chỉ mở trên 127.0.0.1 (xem ports)
      # Compose chỉ dùng môi trường máy chủ/.env để thay thế ${...} trong file này, không tự chuyển vào container;
      # biến nào người vận hành cần đổi (kể cả công tắc tắt) phải được liệt kê ở đây. Mặc định khớp app/infrastructure/config/config.py.
      CHAT_DEMO_ENABLED: ${CHAT_DEMO_ENABLED:-true}
      CHAT_MAX_QUESTION_CHARS: ${CHAT_MAX_QUESTION_CHARS:-500}
      CHAT_MAX_TURNS_PER_SESSION: ${CHAT_MAX_TURNS_PER_SESSION:-30}
      CHAT_SESSION_TTL_SECONDS: ${CHAT_SESSION_TTL_SECONDS:-1800}
      CHAT_MAX_SESSIONS: ${CHAT_MAX_SESSIONS:-200}
    command: python main_chat.py
    ports:
      - "127.0.0.1:8003:8003"
    restart: unless-stopped

volumes:
  milvus_data:
