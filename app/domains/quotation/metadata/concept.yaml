table:
  name: quotation.concept
  description: Khái niệm dùng để phân loại hoặc gắn ngữ nghĩa cho các hạng mục công việc.
columns:
  concept_id:
    description: Định danh duy nhất của concept.
    semantic_type: identifier
    primary_key: true
  type:
    description: |
      Loại concept -- khai báo trong file YAML báo giá cho từng hạng mục
      (work_item), lấy từ danh sách giá trị cho phép (xem
      app/domains/quotation/application/services/ingest/concepts.py).
      Các giá trị type và name tương ứng:
        - stage: "Thi công thô" | "Hoàn thiện" | "Bảo trì"
        - category: "Nội thất" | "Ngoại thất"
        - application: "Tường" | "Sàn" | "Trần" | "Kim loại"
        - effect: "Chống thấm" | "Trang trí" | "Bảo vệ" | "Chống nóng"
        - object: "Nhà ở" | "Văn phòng" | "Nhà xưởng" | "Công trình công cộng"
      Một work_item có thể có nhiều concept, nhưng không lặp lại cùng một
      cặp (type, name) và chỉ có tối đa một concept loại category.
    semantic_type: category
  name:
    description: Tên/giá trị của concept, xem danh sách theo từng type ở cột
      type.
    semantic_type: name
relationships:
  work_items:
    target: quotation.work_item
    type: many_to_many
    description: Concept có thể được gắn với nhiều hạng mục công việc.
association_tables:
  quotation.work_item_concept:
    description: Bảng liên kết many-to-many giữa hạng mục công việc (work_item) và concept.
    columns:
      concept_id:
        references: quotation.concept.concept_id
      item_id:
        references: quotation.work_item.item_id
